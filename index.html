<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Workspace Monitor</title>
    <style>
      :root {
        --bg: #f3f5f7;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --line: #d9e0ea;
        --line-strong: #c7d0dd;
        --text: #17202e;
        --muted: #637083;
        --soft-text: #8a96a8;
        --green: #168153;
        --codex: #2563eb;
        --gemini: #0f766e;
        --claude: #b45309;
        --active: #64748b;
        --ink: #111827;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr;
      }

      .button,
      .refresh {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        padding: 8px 10px;
        cursor: pointer;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .toggle input {
        accent-color: var(--ink);
      }

      .button.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .button:disabled {
        cursor: default;
        color: var(--soft-text);
        background: var(--panel-soft);
      }

      .layout {
        min-height: 0;
        display: grid;
        grid-template-columns: 220px minmax(300px, 0.9fr) minmax(520px, 1.35fr);
      }

      .pane {
        min-height: 0;
        overflow: hidden;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }

      .pane:last-child {
        border-right: 0;
      }

      .pane-header {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .pane-title {
        margin: 0;
        font-size: 13px;
        font-weight: 780;
      }

      .count {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .groups,
      .sessions,
      .detail {
        height: calc(100vh - 50px);
        overflow: auto;
      }

      .groups {
        padding: 10px;
      }

      .group {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        padding: 10px;
        text-align: left;
        cursor: pointer;
      }

      .group:hover {
        background: #f4f7fb;
      }

      .group.active {
        background: #eef2f7;
        border-color: var(--line-strong);
      }

      .group-name {
        font-size: 13px;
        font-weight: 740;
      }

      .group-path {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sessions {
        padding: 8px;
        display: grid;
        align-content: start;
        gap: 6px;
      }

      .session-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px 12px;
        padding: 10px;
        border: 1px solid var(--line);
        border-left-width: 4px;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        text-align: left;
        transition:
          border-color 120ms ease,
          background 120ms ease,
          box-shadow 120ms ease;
      }

      .session-card.running {
        border-left-color: var(--green);
        background: #ffffff;
      }

      .session-card.stopped {
        border-left-color: #a6b0bf;
        background: #f7f9fc;
        color: #5f6b7a;
      }

      .session-card:hover {
        border-color: var(--line-strong);
      }

      .session-card.active {
        border-color: #9aa8ba;
        box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.13);
      }

      .session-card.running.active {
        border-color: #8fb8a5;
        box-shadow: 0 0 0 3px rgba(22, 129, 83, 0.14);
      }

      .session-card.stopped.active {
        border-color: #aab4c2;
        box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.1);
      }

      .task-main {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        min-width: 0;
      }

      .task-copy {
        min-width: 0;
        display: grid;
        gap: 3px;
      }

      .task-side {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;
        flex-wrap: wrap;
      }

      .agent {
        width: 27px;
        height: 27px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        flex: 0 0 auto;
      }

      .agent.codex {
        background: var(--codex);
      }

      .agent.gemini {
        background: var(--gemini);
      }

      .agent.claude {
        background: var(--claude);
      }

      .session-card.stopped .agent {
        filter: grayscale(0.75);
        opacity: 0.58;
      }

      .name {
        min-width: 0;
        font-size: 14px;
        font-weight: 760;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 8px;
        background: #edf8f2;
        color: var(--green);
        font-size: 12px;
        font-weight: 740;
        white-space: nowrap;
      }

      .status.running {
        border: 1px solid #bee3cf;
        background: #edf8f2;
        color: var(--green);
      }

      .status.recent {
        background: #fff8e8;
        color: #a66700;
      }

      .status.stopped,
      .status.archived {
        border: 1px solid #d4dbe5;
        background: #f1f5f9;
        color: #596579;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }

      .status.stopped .dot {
        background: transparent;
        border: 1px solid currentColor;
      }

      .summary {
        color: #3b4657;
        font-size: 12px;
        line-height: 1.4;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .session-card.stopped .name,
      .session-card.stopped .summary {
        color: #6e7a8b;
      }

      .session-card.stopped .chip {
        border-color: #d6dde7;
        color: #7b8797;
        background: #f3f6fa;
      }

      .meta-row {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .chip {
        border: 1px solid #d9e1ec;
        border-radius: 999px;
        padding: 4px 8px;
        color: var(--muted);
        background: var(--panel-soft);
        font-size: 12px;
      }

      .detail {
        padding: 16px;
      }

      .detail-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }

      .detail-title {
        margin: 0 0 5px;
        font-size: 18px;
        letter-spacing: 0;
      }

      .detail-subtitle {
        color: var(--muted);
        font-size: 13px;
        word-break: break-all;
      }

      .chat-log {
        min-height: calc(100vh - 170px);
        max-height: calc(100vh - 170px);
        overflow: auto;
        display: grid;
        align-content: start;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
        padding: 12px;
      }

      .message {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 11px 12px;
        box-shadow: var(--shadow);
      }

      .message.user {
        border-color: #b8c7dc;
        background: #eef4ff;
      }

      .message.assistant {
        border-color: #cbd7c7;
        background: #f6fbf4;
      }

      .message-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 760;
      }

      .message-time {
        color: var(--soft-text);
        font-weight: 600;
      }

      .message-body {
        margin: 0;
        color: var(--text);
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .detail-actions {
        display: none;
      }

      .section {
        margin-bottom: 16px;
      }

      .section-title {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 780;
        text-transform: uppercase;
      }

      .kv {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      .kv-row {
        display: grid;
        grid-template-columns: 118px 1fr;
        min-height: 38px;
        border-bottom: 1px solid var(--line);
      }

      .kv-row:last-child {
        border-bottom: 0;
      }

      .key {
        padding: 10px;
        color: var(--muted);
        background: var(--panel-soft);
        font-size: 12px;
      }

      .value {
        padding: 10px;
        font-size: 12px;
        word-break: break-all;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
        padding: 10px 12px;
        color: var(--text);
        font-size: 13px;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .empty-state {
        padding: 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
      }

      @media (max-width: 1040px) {
        .layout {
          grid-template-columns: 210px minmax(330px, 1fr);
        }

        .pane.detail-pane {
          display: none;
        }
      }

      @media (max-width: 720px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .pane {
          border-right: 0;
        }

        .groups {
          height: auto;
          display: flex;
          overflow-x: auto;
        }

        .group {
          min-width: 180px;
        }

        .pane.group-pane {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .sessions {
          height: auto;
          max-height: 42vh;
        }

        .pane.detail-pane {
          display: block;
          border-top: 1px solid var(--line);
        }

        .detail {
          height: auto;
          padding: 12px;
        }

        .detail-head {
          margin-bottom: 12px;
        }

        .chat-log {
          min-height: 260px;
          max-height: 56vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="layout">
        <aside class="pane group-pane">
          <div class="pane-header">
            <h2 class="pane-title">폴더</h2>
            <span class="count">경로 기준</span>
          </div>
          <nav class="groups" id="groupList" aria-label="Folder groups"></nav>
        </aside>

        <section class="pane">
          <div class="pane-header">
            <h2 class="pane-title">작업</h2>
            <div class="header-actions">
              <label class="toggle">
                <input type="checkbox" id="showStopped" />
                종료 포함
              </label>
              <button class="refresh" type="button" id="refreshAll">새로고침</button>
            </div>
          </div>
          <div class="sessions" id="sessionList"></div>
        </section>

        <section class="pane detail-pane">
          <div class="pane-header">
            <h2 class="pane-title">상세</h2>
            <span class="count" id="detailState">selected</span>
          </div>
          <div class="detail">
            <div class="detail-head">
              <div>
                <h1 class="detail-title" id="detailTitle"></h1>
                <div class="detail-subtitle" id="detailPath"></div>
              </div>
            </div>

            <section class="section">
              <h3 class="section-title">대화 기록</h3>
              <div class="chat-log" id="previewText"></div>
            </section>

          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast">Copied</div>

    <script>
      let tasks = [];
      const sessionList = document.getElementById("sessionList");
      const groupList = document.getElementById("groupList");
      const detailTitle = document.getElementById("detailTitle");
      const detailPath = document.getElementById("detailPath");
      const detailState = document.getElementById("detailState");
      const previewText = document.getElementById("previewText");
      const toast = document.getElementById("toast");
      const showStoppedToggle = document.getElementById("showStopped");

      let selected = null;
      let groupFilter = "all";

      function renderList() {
        sessionList.innerHTML = "";
        const visibleTasks = filteredTasks();
        if (!selected || !visibleTasks.some((task) => task.id === selected.id)) {
          selected = visibleTasks[0] || null;
        }
        renderDetail();
        if (!visibleTasks.length) {
          sessionList.innerHTML = `<div class="empty-state">${filterLabel()} 작업이 이 폴더에 없습니다.</div>`;
          return;
        }
        for (const task of visibleTasks) {
          const card = document.createElement("article");
          const cardState = task.status === "stopped" ? "stopped" : "running";
          card.className = `session-card ${cardState}${selected && task.id === selected.id ? " active" : ""}`;
          card.tabIndex = 0;
          card.innerHTML = `
            <div class="task-main">
              <div class="agent ${task.agent}">${task.badge}</div>
              <div class="task-copy">
                <div class="name">${task.title}</div>
                <div class="summary">${task.contextSummary || task.summary}</div>
              </div>
            </div>
            <div class="task-side">
              <div class="status ${task.status === "stopped" ? "stopped" : "running"}"><span class="dot"></span>${statusLabel(task.status)}</div>
            </div>
            <div class="meta-row">
              <span class="chip">${task.agent}</span>
              <span class="chip">${task.etime ? `실행 시간: ${task.etime}` : "실행 시간: -"}</span>
            </div>
          `;
          card.addEventListener("click", () => selectTask(task.id));
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectTask(task.id);
            }
          });
          sessionList.appendChild(card);
        }
      }

      function renderGroups() {
        const counts = new Map();
        for (const task of tasks) {
          const group = folderGroup(task.path);
          counts.set(group.key, {
            key: group.key,
            name: group.name,
            path: group.path,
            count: (counts.get(group.key)?.count || 0) + 1,
          });
        }
        const groups = [
          {
            key: "all",
            name: "전체",
            path: "감지된 모든 폴더",
            count: [...counts.values()].reduce((sum, group) => sum + group.count, 0),
          },
          ...[...counts.values()].sort((a, b) => a.name.localeCompare(b.name)),
        ];
        if (!groups.some((group) => group.key === groupFilter)) {
          groupFilter = "all";
        }
        groupList.innerHTML = "";
        for (const group of groups) {
          const button = document.createElement("button");
          button.className = `group${group.key === groupFilter ? " active" : ""}`;
          button.type = "button";
          button.innerHTML = `
            <span class="group-name">${group.name}</span>
            <span class="count">${group.count}</span>
            <span class="group-path">${group.path}</span>
          `;
          button.addEventListener("click", () => {
            groupFilter = group.key;
            renderGroups();
            renderList();
          });
          groupList.appendChild(button);
        }
      }

      function filteredTasks() {
        return tasks.filter((task) => {
          if (groupFilter === "all") return true;
          return folderGroup(task.path).key === groupFilter;
        });
      }

      function folderGroup(path) {
        if (!path || path === "cwd unavailable") {
          return { key: "unknown", name: "unknown", path: "cwd unavailable" };
        }
        const homeMatch = path.match(/^(\/Users\/[^/]+|\/home\/[^/]+)(\/.*)?$/);
        if (homeMatch) {
          const relative = (homeMatch[2] || "").replace(/^\/+/, "");
          const parts = relative.split("/").filter(Boolean);
          const name = parts[parts.length - 1] || "~";
          return {
            key: `home:${relative || "~"}`,
            name,
            path: relative ? `~/${relative}` : "~",
          };
        }
        const parts = path.split("/").filter(Boolean);
        const name = parts[parts.length - 1] || path;
        return { key: path, name, path };
      }

      function filterLabel() {
        return showStoppedToggle.checked ? "감지된" : "실행 중인";
      }

      function statusLabel(value) {
        if (value === "running") return "실행 중";
        if (value === "gone") return "사라짐";
        if (value === "stopped") return "종료됨";
        if (value === "archived") return "보관됨";
        return value || "-";
      }

      function detailStateLabel(task) {
        if (task.status === "running") return "실행 중";
        if (task.status === "stopped") return "종료됨";
        if (task.bucket === "recent") return "최근 기록";
        if (task.bucket === "archived") return "보관됨";
        return statusLabel(task.status);
      }

      function selectTask(id) {
        selected = tasks.find((task) => task.id === id) || tasks[0];
        renderList();
        renderDetail();
      }

      function renderDetail() {
        if (!selected) {
          detailTitle.textContent = "선택된 작업 없음";
          detailPath.textContent = "";
          detailState.textContent = "비어 있음";
          previewText.textContent = "작업을 선택하면 대화 기록을 볼 수 있습니다.";
          return;
        }
        detailTitle.textContent = selected.title;
        detailPath.textContent = selected.path;
        detailState.textContent = detailStateLabel(selected);
        renderMessages(selected);
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderMessages(task) {
        const messages = task.contextMessages || [];
        if (!messages.length) {
          previewText.textContent = task.contextText || task.summary || "대화 기록을 표시할 수 없습니다.";
          return;
        }
        previewText.innerHTML = messages
          .map((message) => {
            const isUser = message.speaker === "사용자";
            return `
              <article class="message ${isUser ? "user" : "assistant"}">
                <div class="message-head">
                  <span>${escapeHtml(message.speaker || "-")}</span>
                  <span class="message-time">${escapeHtml(message.time || "")}</span>
                </div>
                <pre class="message-body">${escapeHtml(message.text || "")}</pre>
              </article>
            `;
          })
          .join("");
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 1400);
      }

      document
        .getElementById("refreshAll")
        .addEventListener("click", () => loadTasks());

      showStoppedToggle.addEventListener("change", () => loadTasks());

      async function loadTasks() {
        try {
          const stoppedQuery = showStoppedToggle.checked ? "?stopped=1" : "";
          const response = await fetch(`/api/tasks${stoppedQuery}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          tasks = payload.tasks || [];
          selected = tasks.find((task) => selected && task.id === selected.id) || null;
          renderGroups();
          renderList();
          showToast("작업 목록을 새로고침했습니다");
        } catch (error) {
          tasks = [];
          selected = null;
          renderGroups();
          renderList();
          showToast("실제 작업 목록을 불러오지 못했습니다");
          console.error(error);
        }
      }

      loadTasks();
    </script>
  </body>
</html>
